[build-system]
requires = [
    "setuptools>=64",
    "wheel",
    "Cython>=3.0",
    "numpy>=1.23",
]
build-backend = "setuptools.build_meta"

[project]
name = "ngram"
version = "0.1.0"
description = "Infini-gram: disk-backed suffix-array n-gram and unbounded-n indexes over token corpora"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "Honglu Fan", email = "honglu2875@gmail.com" }]
keywords = ["ngram", "infini-gram", "suffix array", "language model", "corpus"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Cython",
    "License :: OSI Approved :: Apache Software License",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["numpy>=1.23"]

[project.optional-dependencies]
tokenizers = ["transformers>=4.30", "tiktoken>=0.5"]
jsonl = ["zstandard>=0.20"]
dev = ["pytest>=7", "zstandard>=0.20"]

[project.scripts]
ngram = "ngram.cli:main"

[project.urls]
Homepage = "https://github.com/honglu2875/ngram"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error::DeprecationWarning"]
